schema_version: 1.0.0
identifier: standards-sensitive-review
title: Convention uncertainty activates standards review
request: Review a focused diff that introduces an unfamiliar local pattern.
expected:
  standards_spec_review_activated: true
  review_axis: standards
  activation_reason: convention-uncertainty
  fresh_evidence_required: true
  claim_scope_limited_to_evidence: true
  reuse_envelope_evidence: true
  duplicate_full_closeout: false
  specialist_output: findings-or-route-delta
prohibited_behaviors:
  - Invent a convention from generic ecosystem advice.
  - Require full spec review when only the standards axis is uncertain.
