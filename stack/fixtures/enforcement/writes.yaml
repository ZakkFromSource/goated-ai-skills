        expect:
          decision: hold
          holds: [{gate: scripted-edit, kind: justified-skip}]

  - name: an inline script writing under the system temp folder is not held
    covers:
      - {gate: scripted-edit, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Save the export sample to a temp file.}
