      - reply: "goated-route: direct"
      - call: {kind: shell_command, shell: posix, command: "python - <<'EOF'\nimport os, tempfile\nopen(os.path.join(tempfile.gettempdir(), 'sample.csv'), 'w').write('a')\nEOF"}
      - call: {kind: shell_command, shell: posix, command: "node -e \"fs.writeFileSync(path.join(os.tmpdir(), 'sample.csv'), 'a')\""}

  - name: the same script writing a run-time path inside the project is held
