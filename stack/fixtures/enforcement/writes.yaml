  - name: a test file named for login sessions is not security-sensitive
    covers:
      - {gate: security, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the session timeout test.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call:
          kind: file_write
          path: tests/test_login_session.py
          edits: [{removed: "assert ttl == 10", added: "assert ttl == 20"}]

  - name: a test path that is not test code, or matches by its kind, is still security-sensitive
    covers:
      - {gate: security, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Change the test setup.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: file_write, path: tests/.env, edits: [{removed: "a = 1", added: "a = 2"}]}
        expect: &security_held {decision: hold, holds: [{gate: security, kind: justified-skip}]}
      - call: {kind: file_write, path: tests/requirements.txt, edits: [{removed: "a = 1", added: "a = 2"}]}
        expect: *security_held
      - call: {kind: file_write, path: requirements_test.txt, edits: [{removed: "a = 1", added: "a = 2"}]}
        expect: *security_held
      - call: {kind: file_write, path: .github/workflows/run_test.yml, edits: [{removed: "a = 1", added: "a = 2"}]}
        expect: *security_held
      - call: {kind: file_write, path: docker-compose.test.yml, edits: [{removed: "a = 1", added: "a = 2"}]}
        expect: *security_held
      - call: {kind: file_write, path: test/fixtures/server.key, edits: [{removed: "a = 1", added: "a = 2"}]}
        expect: *security_held
      - call: {kind: file_write, path: tests/secrets.json, edits: [{removed: "a = 1", added: "a = 2"}]}
        expect: *security_held
      - call: {kind: file_write, path: migrations/0001_test.sql, edits: [{removed: "a = 1", added: "a = 2"}]}
        expect: *security_held
      - call: {kind: file_write, path: src/testing/auth.py, edits: [{removed: "a = 1", added: "a = 2"}]}
        expect: *security_held
      - call: {kind: file_write, path: src/contest/auth.py, edits: [{removed: "a = 1", added: "a = 2"}]}
        expect: *security_held

  - name: session code beside another auth word is security-sensitive
    covers:
      - {gate: security, case: holds}
      - {gate: security, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the session timeout.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: &auth_session
          kind: file_write
          path: src/auth/session.py
          edits: [{removed: "ttl = 10", added: "ttl = 20"}]
        expect: &session_held
          decision: hold
          holds: [{gate: security, kind: justified-skip}]
      - call: &login_session
          kind: file_write
          path: src/login_session.py
          edits: [{removed: "ttl = 10", added: "ttl = 20"}]
        expect: *session_held
      - call: {kind: skill_load, skill: code-security-review}
      - call: *auth_session
      - call: *login_session

  - name: session code with no other auth word is not security-sensitive
    covers:
      - {gate: security, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the session timeout.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call:
          kind: file_write
          path: src/runtime/session.py
          edits: [{removed: "ttl = 10", added: "ttl = 20"}]

  - name: an edit inside an open merge conflict waits for the conflict skill
    covers:
      - {gate: conflict-resolution, case: holds}
      - {gate: conflict-resolution, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Merge the feature branch.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: &merge {kind: shell_command, shell: posix, command: git merge feature}
        result: &conflicted {ok: false, output: "CONFLICT (content): Merge conflict in src/export.py\nAutomatic merge failed; fix conflicts and then commit the result."}
      - call: &resolve
          kind: file_write
          path: src/export.py
          edits: [{removed: "<<<<<<< HEAD\nlimit = 1\n=======\nlimit = 2\n>>>>>>> feature", added: "limit = 2"}]
        expect:
          decision: hold
          holds: [{gate: conflict-resolution, kind: justified-skip}]
      - call: {kind: skill_load, skill: resolving-merge-conflicts}
      - call: *resolve

  - name: a skip line clears the conflict hold
    covers:
      - {gate: conflict-resolution, case: clears, way: skip-line}
    steps:
      - prompt: {type: prompt, author: person, text: Merge the feature branch.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *merge
        result: *conflicted
      - call: *resolve
        expect:
          decision: hold
          holds: [{gate: conflict-resolution, kind: justified-skip}]
      - reply: "goated-skip: resolving-merge-conflicts: the feature side replaces one constant"
      - call: *resolve

  - name: a person's skip clears the conflict hold
    covers:
      - {gate: conflict-resolution, case: clears, way: override}
    steps:
      - prompt: {type: prompt, author: person, text: Merge the feature branch.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *merge
        result: *conflicted
      - call: *resolve
        expect:
          decision: hold
          holds: [{gate: conflict-resolution, kind: justified-skip}]
      - prompt: {type: prompt, author: person, text: Skip resolving-merge-conflicts and merge the feature branch.}
        expect: {decision: allow, notices: [override_recorded, route_continued]}
      - reply: "goated-route: continue"
      - call: *merge
        result: *conflicted
      - call: *resolve

  - name: a heading underline is not a conflict marker
    covers:
      - {gate: conflict-resolution, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Retitle the export notes.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call:
          kind: file_write
          path: docs/notes.md
          edits: [{removed: "Export\n=======", added: "Exports\n======="}]

  - name: a failed commit call leaves the conflict open
    covers:
      - {gate: conflict-resolution, case: holds}
    steps:
      - prompt: &commit_prompt {type: prompt, author: person, text: "Merge the feature branch and commit it. Commit message: \"Merge feature\""}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *merge
        result: *conflicted
      - call: &commit_call {kind: commit, message: Merge feature}
        result: {ok: false, output: "error: committing is not possible because you have unmerged files"}
      - call: &notes_edit
          kind: file_write
          path: docs/notes.md
          edits: [{removed: "limit 1", added: "limit 2"}]
        expect:
          decision: hold
          holds: [{gate: conflict-resolution, kind: justified-skip}]

  - name: a finished commit call ends the conflict
    covers:
      - {gate: conflict-resolution, case: near-miss}
    steps:
      - prompt: *commit_prompt
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *merge
        result: *conflicted
      - call: *commit_call
      - call: *notes_edit

  - name: a cat of a file showing a marker opens the conflict for that file only
    covers:
      - {gate: conflict-resolution, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Finish the export merge.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: shell_command, shell: posix, command: cat src/export.py}
        result: {ok: true, output: "<<<<<<< HEAD\nlimit = 1\n=======\nlimit = 2\n>>>>>>> feature\n"}
      - call: *notes_edit
      - call: *resolve
        expect:
          decision: hold
          holds: [{gate: conflict-resolution, kind: justified-skip}]

  - name: a cat of a file with no marker opens nothing
    covers:
      - {gate: conflict-resolution, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Raise the export limit.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: shell_command, shell: posix, command: cat src/export.py}
        result: {ok: true, output: "limit = 1\n"}
      - call:
          kind: file_write
          path: src/export.py
          edits: [{removed: "limit = 1", added: "limit = 2"}]

  - name: a git diff adding a marker opens the conflict for that file's section
    covers:
      - {gate: conflict-resolution, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Finish the export merge.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: shell_command, shell: posix, command: git diff}
        result:
          ok: true
          output: "diff --cc src/export.py\nindex 1a2b3c4,5d6e7f8..0000000\n--- a/src/export.py\n+++ b/src/export.py\n@@@ -1,1 -1,1 +1,5 @@@\n++<<<<<<< HEAD\n +limit = 1\n++=======\n+ limit = 2\n++>>>>>>> feature\n"
      - call: *notes_edit
      - call: *resolve
        expect:
          decision: hold
          holds: [{gate: conflict-resolution, kind: justified-skip}]

  - name: a write after the same check fails twice waits for diagnosis
    covers:
      - {gate: repeated-failure, case: holds}
      - {gate: repeated-failure, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Make the export tests pass.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: &check {kind: shell_command, shell: posix, command: pytest -q}
        result: &failed {ok: false, output: "F\n1 failed in 0.10s"}
      - call: *check
        result: *failed
      - call: &patch
          kind: file_write
          path: src/export.py
          edits: [{removed: "limit = 1", added: "limit = 2"}]
        expect:
          decision: hold
          holds: [{gate: repeated-failure, kind: justified-skip}]
      - call: {kind: skill_load, skill: diagnose}
      # Once diagnose counts as loaded, the registry's signal for this gate
      # selects its tracing reference, which the file edit lands owing.
      - call: *patch
        expect: {decision: allow, notices: [reads_owed]}

  - name: a skip line clears the repeated-failure hold
    covers:
      - {gate: repeated-failure, case: clears, way: skip-line}
    steps:
      - prompt: {type: prompt, author: person, text: Make the export tests pass.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *check
        result: *failed
      - call: *check
        result: *failed
      - call: *patch
        expect:
          decision: hold
          holds: [{gate: repeated-failure, kind: justified-skip}]
      - reply: "goated-skip: diagnose: the failure names the wrong constant directly"
      - call: *patch

  - name: a person's skip clears the repeated-failure hold
    covers:
      - {gate: repeated-failure, case: clears, way: override}
    steps:
      - prompt: {type: prompt, author: person, text: Make the export tests pass.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *check
        result: *failed
      - call: *check
        result: *failed
      - call: *patch
        expect:
          decision: hold
          holds: [{gate: repeated-failure, kind: justified-skip}]
      - prompt: {type: prompt, author: person, text: Skip diagnose and make the export tests pass.}
        expect: {decision: allow, notices: [override_recorded, route_continued]}
      - reply: "goated-route: continue"
      - call: *check
        result: *failed
      - call: *check
        result: *failed
      - call: *patch

  # Ticket 111: holds lines can clear come in one message, which ends in one
  # clearing section; once one is cleared, the other is a single hold. Since
  # Ticket 118 a file edit lands owing its reads, so the read gate's hold is
  # met by a short shell write, whose text selects no registry reference: two
  # such holds share the message, not three.
  - name: holds lines can clear share one message, and lines clear them in one retry
    covers:
      - {gate: design-reads, case: holds}
      - {gate: repeated-failure, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Isolate the export settings from the client.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *check
        result: *failed
      - call: *check
        result: *failed
      - call: &shell_app_settings {kind: shell_command, shell: posix, command: "generate-settings > config/app.json"}
        expect:
          decision: hold
          holds:
            - {gate: design-reads, kind: justified-skip}
            - {gate: repeated-failure, kind: justified-skip}
      - reply: "goated-skip: software-design-principles: one setting with no design in it"
      - call: *shell_app_settings
        expect:
          decision: hold
          holds: [{gate: repeated-failure, kind: justified-skip}]
      - reply: "goated-skip: diagnose: the failure names the missing client directly"
      - call: *shell_app_settings

  - name: a second run with fewer failures is progress, not a repeat
    covers:
      - {gate: repeated-failure, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Make the export tests pass.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *check
        result: {ok: false, output: "FFF\n3 failed in 0.10s"}
      - call: *check
        result: {ok: false, output: "F..\n1 failed, 2 passed in 0.10s"}
      - call: *patch

  - name: a reviewer started in the background counts once its finish arrives
    covers:
      - {gate: review-intake, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: "Have the export change reviewed, then act on it."}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: subagent-driven-development}
      - call: *reviewer_prompt
      - call: *review
        result: {ok: true, output: Started in the background., agent: {id: reviewer-bg, background: true}}
      - call: *fix
      - agent_finished: reviewer-bg
      - call: *fix
        expect:
          decision: hold
          holds: [{gate: review-intake, kind: justified-skip}]

  - name: a notebook cell's edit is judged by the text it adds, or held when it shows none
    covers:
      - {gate: design, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Rework the export notebook.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call:
          kind: file_write
          path: notebooks/export.ipynb
          edits: [{removed: null, added: "rows = load()\nrows = clean(rows)\nrows = rank(rows)\nsave(rows)\nreport(rows)\n"}]
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - call:
          kind: file_write
          path: notebooks/export.ipynb
          edits: [{removed: null, added: null}]
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]

  - name: a check that never ran neither fails nor passes
    covers:
      - {gate: repeated-failure, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Make the export tests pass.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *check
        result: *failed
      - call: *check
        result: {ok: false, ran: false}
      - call: *patch
