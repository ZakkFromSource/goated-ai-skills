event_model: 5
scenarios:
  - name: a substantial code change waits for design principles
    covers:
      - {gate: design, case: holds}
      - {gate: design, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export totals.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: &totals
          kind: file_write
          path: src/export.py
          edits: [{removed: "pass", added: "total_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\ntotal_5 = 5"}]
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *totals

  - name: a skip line clears the design hold
    covers:
      - {gate: design, case: clears, way: skip-line}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export totals.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *totals
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - reply: "goated-skip: software-design-principles: one mechanical list of constants"
      - call: *totals

  - name: a person's skip clears the design hold
    covers:
      - {gate: design, case: clears, way: override}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export totals.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *totals
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - prompt: {type: prompt, author: person, text: Skip software-design-principles and add the export totals.}
        expect: {decision: allow, notices: [override_recorded, route_continued]}
      - reply: "goated-route: continue"
      - call: *totals

  - name: a test file never meets the design hold
    covers:
      - {gate: design, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Add the totals test.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call:
          kind: file_write
          path: tests/test_export.py
          edits: [{removed: "pass", added: "total_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\ntotal_5 = 5"}]

  - name: a shell write of six code lines waits for design principles
    covers:
      - {gate: design, case: holds}
      - {gate: design, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export totals.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: &shell_totals
          kind: shell_command
          shell: posix
          command: "cat > src/export.py <<'EOF'\ntotal_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\ntotal_5 = 5\nEOF"
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *shell_totals

  - name: text a shell write does not show, or adds under two spellings, counts in full
    covers:
      - {gate: design, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export totals.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: shell_command, shell: posix, command: "CODE=$(python gen.py); echo \"$CODE\" > src/export.py"}
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - call: {kind: shell_command, shell: powershell, command: "Set-Content src/export.py -Value (Get-Content gen.py -Raw)"}
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - call:
          kind: shell_command
          shell: posix
          command: "cat > src/export.py <<'EOF'\ntotal_0 = 0\ntotal_1 = 1\ntotal_2 = 2\nEOF\ncat >> ./src/export.py <<'EOF'\ntotal_3 = 3\ntotal_4 = 4\nEOF"
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - call: {kind: shell_command, shell: powershell, command: "New-Item -ItemType File src/export.py -Value @'\ntotal_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\n'@"}
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]

  - name: a short text a shell write shows is a small change
    covers:
      - {gate: design, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Set the export total.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: shell_command, shell: posix, command: "echo 'total = 1' | cat > src/export.py"}
      - call: {kind: shell_command, shell: powershell, command: "Set-Content -Path src/export.py 'total = 1'"}
      - call: {kind: shell_command, shell: powershell, command: "'total = 1' | Out-File src/export.py"}

  # Ticket 118: a file edit the read gates would hold for reads alone lands
  # at any size and owes them, so scenarios that show what a file edit
  # selects expect a `reads_owed` notice where they once expected a hold.
  - name: a shell write is the turn's first substantial change and counts toward the third code file
    covers:
      - {gate: design-reads, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Split the export totals.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: {kind: shell_command, shell: posix, command: "cat > src/a.py <<'EOF'\ntotal_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\ntotal_5 = 5\nEOF"}
      - call: {kind: shell_command, shell: posix, command: "cat > src/b.py <<'EOF'\ntotal_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\ntotal_5 = 5\nEOF"}
      - call:
          kind: file_write
          path: src/c.py
          edits: [{removed: "pass", added: "total_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\ntotal_5 = 5"}]
        expect: {decision: allow, notices: [reads_owed]}

  - name: a shell write to a test file, or a copy of configuration, selects no design reference
    covers:
      - {gate: design-reads, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export test and settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: {kind: shell_command, shell: posix, command: "cat > tests/test_export.py <<'EOF'\ndef test_total():\n    assert 1 == 1\n\n\ndef test_limit():\n    assert 2 == 2\nEOF"}
      - call: {kind: shell_command, shell: posix, command: cp defaults/export.json config/export.json}

  - name: a shell copy of code adds no text designed in the command
    covers:
      - {gate: design, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Restore the export module.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: shell_command, shell: posix, command: cp backup/export.py src/export.py}
      - call: {kind: shell_command, shell: posix, command: git apply export.diff}

  - name: a shell write to a configuration file waits for the reference it selects
    covers:
      - {gate: design-reads, case: holds}
      - {gate: design-reads, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: &shell_settings
          kind: shell_command
          shell: posix
          command: "generate-settings > config/export.json"
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - call: {kind: file_read, path: "{outside}/skills/software-design-principles/references/decoupling.md", whole: true}
      - call: *shell_settings

  - name: a configuration change lands owing the reference it selects, and owes nothing once it is read
    covers:
      - {gate: design-reads, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: &settings
          kind: file_write
          path: config/export.json
          whole_file: true
          edits: [{removed: null, added: "{\n  \"limit\": 2,\n  \"format\": \"csv\",\n  \"header\": true,\n  \"quote\": \"minimal\"\n}\n"}]
        expect: {decision: allow, notices: [reads_owed]}
      - call: {kind: file_read, path: "{outside}/skills/software-design-principles/references/decoupling.md", whole: true}
      # A new turn, where an unread reference would be owed and named again.
      - prompt: {type: prompt, author: person, text: Go on.}
      - reply: "goated-route: continue"
      - call: *settings
        expect: {decision: allow, notices: []}

  - name: a configuration write of forty lines lands past design-reads and owes its read
    covers:
      - {gate: design-reads, case: near-miss}
      - {gate: closeout, case: holds}
      - {gate: closeout, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: &large_settings
          kind: file_write
          path: config/export.json
          whole_file: true
          edits: [{removed: null, added: "{\n  \"key_00\": 0,\n  \"key_01\": 1,\n  \"key_02\": 2,\n  \"key_03\": 3,\n  \"key_04\": 4,\n  \"key_05\": 5,\n  \"key_06\": 6,\n  \"key_07\": 7,\n  \"key_08\": 8,\n  \"key_09\": 9,\n  \"key_10\": 10,\n  \"key_11\": 11,\n  \"key_12\": 12,\n  \"key_13\": 13,\n  \"key_14\": 14,\n  \"key_15\": 15,\n  \"key_16\": 16,\n  \"key_17\": 17,\n  \"key_18\": 18,\n  \"key_19\": 19,\n  \"key_20\": 20,\n  \"key_21\": 21,\n  \"key_22\": 22,\n  \"key_23\": 23,\n  \"key_24\": 24,\n  \"key_25\": 25,\n  \"key_26\": 26,\n  \"key_27\": 27,\n  \"key_28\": 28,\n  \"key_29\": 29,\n  \"key_30\": 30,\n  \"key_31\": 31,\n  \"key_32\": 32,\n  \"key_33\": 33,\n  \"key_34\": 34,\n  \"key_35\": 35,\n  \"key_36\": 36\n}\n"}]
        expect: {decision: allow, notices: [reads_owed]}
      - turn_end: true
        expect:
          decision: hold
          holds: [{gate: closeout, kind: justified-skip, items: [Reads]}]
      - call: {kind: file_read, path: config/export.json, whole: true}
      - call: {kind: file_read, path: "{outside}/skills/software-design-principles/references/decoupling.md", whole: true}
      - turn_end: true
        expect:
          decision: hold
          holds: [{gate: closeout, kind: justified-skip, items: [Reads]}]
      - call: {kind: file_read, path: config/export.json, whole: true}
      - turn_end: true

  - name: a configuration write of twenty-nine counted lines lands owing its read as a long one does
    covers:
      - {gate: design-reads, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call:
          kind: file_write
          path: config/export.json
          whole_file: true
          edits: [{removed: null, added: "{\n  \"key_00\": 0,\n  \"key_01\": 1,\n  \"key_02\": 2,\n  \"key_03\": 3,\n  \"key_04\": 4,\n  \"key_05\": 5,\n  \"key_06\": 6,\n  \"key_07\": 7,\n  \"key_08\": 8,\n  \"key_09\": 9,\n  \"key_10\": 10,\n  \"key_11\": 11,\n  \"key_12\": 12,\n  \"key_13\": 13,\n  \"key_14\": 14,\n  \"key_15\": 15,\n  \"key_16\": 16,\n  \"key_17\": 17,\n  \"key_18\": 18,\n  \"key_19\": 19,\n  \"key_20\": 20,\n  \"key_21\": 21,\n  \"key_22\": 22,\n  \"key_23\": 23,\n  \"key_24\": 24,\n  \"key_25\": 25\n}\n"}]
        expect: {decision: allow, notices: [reads_owed]}

  - name: a long shell write lands only when the command shows its text
    covers:
      - {gate: design-reads, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: {kind: shell_command, shell: posix, command: "cat > config/export.json <<EOF\n{\n  \"key_00\": \"$(date)\",\n  \"key_01\": 1,\n  \"key_02\": 2,\n  \"key_03\": 3,\n  \"key_04\": 4,\n  \"key_05\": 5,\n  \"key_06\": 6,\n  \"key_07\": 7,\n  \"key_08\": 8,\n  \"key_09\": 9,\n  \"key_10\": 10,\n  \"key_11\": 11,\n  \"key_12\": 12,\n  \"key_13\": 13,\n  \"key_14\": 14,\n  \"key_15\": 15,\n  \"key_16\": 16,\n  \"key_17\": 17,\n  \"key_18\": 18,\n  \"key_19\": 19,\n  \"key_20\": 20,\n  \"key_21\": 21,\n  \"key_22\": 22,\n  \"key_23\": 23,\n  \"key_24\": 24,\n  \"key_25\": 25,\n  \"key_26\": 26,\n  \"key_27\": 27,\n  \"key_28\": 28,\n  \"key_29\": 29,\n  \"key_30\": 30,\n  \"key_31\": 31,\n  \"key_32\": 32,\n  \"key_33\": 33,\n  \"key_34\": 34,\n  \"key_35\": 35,\n  \"key_36\": 36\n}\nEOF"}
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - call: {kind: shell_command, shell: posix, command: "cat > config/export.json <<'EOF'\n{\n  \"key_00\": 0,\n  \"key_01\": 1,\n  \"key_02\": 2,\n  \"key_03\": 3,\n  \"key_04\": 4,\n  \"key_05\": 5,\n  \"key_06\": 6,\n  \"key_07\": 7,\n  \"key_08\": 8,\n  \"key_09\": 9,\n  \"key_10\": 10,\n  \"key_11\": 11,\n  \"key_12\": 12,\n  \"key_13\": 13,\n  \"key_14\": 14,\n  \"key_15\": 15,\n  \"key_16\": 16,\n  \"key_17\": 17,\n  \"key_18\": 18,\n  \"key_19\": 19,\n  \"key_20\": 20,\n  \"key_21\": 21,\n  \"key_22\": 22,\n  \"key_23\": 23,\n  \"key_24\": 24,\n  \"key_25\": 25,\n  \"key_26\": 26,\n  \"key_27\": 27,\n  \"key_28\": 28,\n  \"key_29\": 29,\n  \"key_30\": 30,\n  \"key_31\": 31,\n  \"key_32\": 32,\n  \"key_33\": 33,\n  \"key_34\": 34,\n  \"key_35\": 35,\n  \"key_36\": 36\n}\nEOF"}
        expect: {decision: allow, notices: [reads_owed]}

  - name: a large first code change meets the design gate until the skill loads, then lands owing its reads
    covers:
      - {gate: design, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export totals.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: &large_totals
          kind: file_write
          path: src/export.py
          whole_file: true
          edits: [{removed: null, added: "def total_0():\n    return 0\ndef total_1():\n    return 1\ndef total_2():\n    return 2\ndef total_3():\n    return 3\ndef total_4():\n    return 4\ndef total_5():\n    return 5\ndef total_6():\n    return 6\ndef total_7():\n    return 7\ndef total_8():\n    return 8\ndef total_9():\n    return 9\ndef total_10():\n    return 10\ndef total_11():\n    return 11\ndef total_12():\n    return 12\ndef total_13():\n    return 13\ndef total_14():\n    return 14\ndef total_15():\n    return 15\ndef total_16():\n    return 16\ndef total_17():\n    return 17\ndef total_18():\n    return 18\ndef total_19():\n"}]
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *large_totals
        expect: {decision: allow, notices: [reads_owed]}
      - turn_end: true
        expect:
          decision: hold
          holds: [{gate: closeout, kind: justified-skip, items: [Reads, Proof, Docs, Design]}]

  - name: lines a shell write puts into a file outside the project do not make it large
    covers:
      - {gate: design-reads, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: {kind: shell_command, shell: posix, command: "cat > {outside}/notes.txt <<'EOF'\nnote 0\nnote 1\nnote 2\nnote 3\nnote 4\nnote 5\nnote 6\nnote 7\nnote 8\nnote 9\nnote 10\nnote 11\nnote 12\nnote 13\nnote 14\nnote 15\nnote 16\nnote 17\nnote 18\nnote 19\nnote 20\nnote 21\nnote 22\nnote 23\nnote 24\nnote 25\nnote 26\nnote 27\nnote 28\nnote 29\nnote 30\nnote 31\nnote 32\nnote 33\nnote 34\nnote 35\nnote 36\nnote 37\nnote 38\nnote 39\nEOF\ncat > config/export.json <<'EOF'\n{\n  \"limit\": 2,\n  \"format\": \"csv\",\n  \"header\": true,\n  \"quote\": \"minimal\"\n}\nEOF"}
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]

  - name: configuration under a fixtures folder is test data the design reads do not judge
    covers:
      - {gate: design-reads, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export fixtures.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call:
          kind: file_write
          path: stack/fixtures/export.yaml
          edits: [{removed: "limit: 1", added: "limit: 2\nformat: csv\nheader: true\nquote: minimal\nrows: 3"}]
      - call:
          kind: file_write
          path: web/__fixtures__/export.json
          whole_file: true
          edits: [{removed: null, added: "{\n  \"limit\": 2,\n  \"format\": \"csv\",\n  \"header\": true,\n  \"quote\": \"minimal\"\n}\n"}]

  - name: configuration outside a fixtures folder, and code inside one, are still judged
    covers:
      - {gate: design-reads, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings and fixture builder.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call:
          kind: file_write
          path: config/export.yaml
          edits: [{removed: "limit: 1", added: "limit: 2\nformat: csv\nheader: true\nquote: minimal\nrows: 3"}]
        expect: {decision: allow, notices: [reads_owed]}
      - call:
          kind: file_write
          path: fixtures/build.py
          edits: [{removed: "pass", added: "def build_rows():\n    return []"}]
        expect: {decision: allow, notices: [reads_owed]}

  - name: a public definition in a code file lands owing the references it selects
    covers:
      - {gate: design-reads, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export entry point.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call:
          kind: file_write
          path: src/lib.rs
          edits: [{removed: "", added: "pub fn run() {}"}]
        expect: {decision: allow, notices: [reads_owed]}

  # Ticket 118, phase 2: the turn's first landed edit names what it owes; a
  # later one names only references it adds, and carries no notice when it
  # adds none. A new turn starts the list again.
  - name: one notice per turn names the owed references, and a later edit only those it adds
    covers:
      - {gate: design-reads, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export entry points.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: &run_fn {kind: file_write, path: src/lib.rs, edits: [{removed: "", added: "pub fn run() {}"}]}
        expect: {decision: allow, notices: [reads_owed]}
      - call: {kind: file_write, path: src/lib.rs, edits: [{removed: "", added: "pub fn stop() {}"}]}
        expect: {decision: allow, notices: []}
      - call: {kind: file_write, path: src/save.py, edits: [{removed: "pass", added: "try:\n    save()\nexcept OSError:\n    raise"}]}
        expect: {decision: allow, notices: [reads_owed]}
      - prompt: {type: prompt, author: person, text: Add the export entry points to the importer too.}
      - reply: "goated-route: continue"
      - call: *run_fn
        expect: {decision: allow, notices: [reads_owed]}

  - name: a re-export, an async arrow function, and a configuration key define nothing
    covers:
      - {gate: design-reads, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Wire the export helpers.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call:
          kind: file_write
          path: src/lib.rs
          edits: [{removed: "", added: "pub use export::run;"}]
      - call:
          kind: file_write
          path: src/export.js
          edits: [{removed: "", added: "async () => run()"}]
      - call:
          kind: file_write
          path: config/export.yaml
          edits: [{removed: "", added: "class: foo"}]

  - name: a skip line clears the design-reads hold
    covers:
      - {gate: design-reads, case: clears, way: skip-line}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *shell_settings
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - reply: "goated-skip: software-design-principles: one setting with no design in it"
      - call: *shell_settings

  - name: a person's skip clears the design-reads hold
    covers:
      - {gate: design-reads, case: clears, way: override}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *shell_settings
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
