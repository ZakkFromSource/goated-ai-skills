schema_version: 1.0.0
identifier: message-only-commit
title: Commit drafting returns message text only
request: Write a commit message for the inspected changes.
expected:
  first_output: commit-message-text
  message_text_only_by_default: true
  stages_files: false
  creates_commit: false
  pushes: false
  suggests_commands: false
  optional_context_only_when_material: true
prohibited_behaviors:
  - Stage, commit, push, or mutate repository state.
  - Add git commands or command suggestions the user did not request.
